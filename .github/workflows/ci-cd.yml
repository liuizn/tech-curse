name: CI/CD Pipeline - Tech Curse API

# Gatilhos: Roda em todo PR e em todo push/merge direto
on:
  push:
    branches: [ "main", "v1.2" ]
  pull_request:
    branches: [ "main", "v1.2" ]

jobs:
  # ==========================================
  # JOB 1: RESTORE, BUILD, TESTES E PUBLICAÇÃO
  # ==========================================
  build-and-test:
    name: Build, Tests and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TechCurse.slnx

      - name: Build
        run: dotnet build TechCurse.slnx --configuration Release --no-restore

      - name: Unit and Integration Tests
        # Executa os testes isolados e de integração presentes na sua solution
        run: dotnet test TechCurse.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Artifacts
        run: dotnet publish src/Api/TechCurse.Api.csproj -c Release -o ./publish_output /p:UseAppHost=false

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-published-app
          path: ./publish_output

  # ==========================================
  # JOB 2: DOCKER IMAGE BUILD, PUSH E SMOKE TEST
  # ==========================================
  build-and-push-image:
    name: Docker Build and Push
    needs: build-and-test
    # Condição: Este job SÓ executa se o Job 1 passar E se for um push/merge (ignora em PRs soltos)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.2')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          # Lendo os segredos armazenados de forma segura no GitHub
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tech-curse-api:latest

      - name: Smoke Test (Validação do Container)
        # Cria o .env dinamicamente com os segredos, sobe a stack e bate no Health Check
        run: |
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "JWT_SIGNING_KEY=${{ secrets.JWT_SIGNING_KEY }}" >> .env
          echo "JWT_ISSUER=GitHubActions_Issuer" >> .env
          echo "JWT_AUDIENCE=GitHubActions_Audience" >> .env
          echo "SEQ_PASSWORD=${{ secrets.SEQ_PASSWORD }}" >> .env
          
          echo "Iniciando a orquestração do docker-compose para o Smoke Test..."
          docker compose up -d
          
          echo "Aguardando 20 segundos para a API, DB, Redis e Seq inicializarem as portas..."
          sleep 20
          
          echo "Disparando requisição contra o endpoint de Health Check..."
          curl --fail http://localhost:8080/health || exit 1